<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: white;
        }

        .container {
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background: rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(0,198,255,0.2);
        }

        a {
            color: red;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 8px 15px;
            background: #00c6ff;
            border-radius: 8px;
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <h1>Admin Panel</h1>
        <a href="/logout" class="btn">Logout</a>
    </div>

    <!-- USERS -->
    <h2>Users</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Action</th>
        </tr>

        {% for u in users %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
            <td>
                <a href="/delete_user/{{ u[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <!-- CHATS -->
    <h2>Chat History</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>User</th>
            <th>Sender</th>
            <th>Message</th>
            <th>Time</th>
            <th>Action</th>
        </tr>

        {% for c in chats %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
            <td>{{ c[4] }}</td>
            <td>
                <a href="/delete_chat/{{ c[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/clear_chats" class="btn">Clear All Chats</a>

</div>

</body>
</html>
