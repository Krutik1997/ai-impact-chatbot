<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Chatbot Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #06b6d4;
            --bg-dark: #0f172a;
            --card: rgba(255,255,255,0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
        }

        /* LEFT SIDE */
        .left {
            width: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 40px;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .left p {
            max-width: 300px;
            opacity: 0.9;
        }

        /* RIGHT SIDE */
        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020617;
        }

        /* CARD */
        .container {
            width: 360px;
            padding: 35px;
            border-radius: 20px;
            background: var(--card);
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            color: white;
            animation: slideIn 0.8s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        p {
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
            opacity: 0.7;
        }

        /* INPUT */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box i {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            color: gray;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 40px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 8px var(--secondary);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--secondary);
            transform: translateY(-2px);
        }

        /* MESSAGE */
        .msg {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }

        /* LINKS */
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        a {
            color: var(--secondary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* MOBILE */
        @media(max-width: 768px) {
            body {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
                height: 50%;
            }
        }

    </style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">
    <h1>Welcome Back 🤖</h1>
    <p>Login to continue chatting with your AI assistant.</p>
</div>

<!-- RIGHT SIDE -->
<div class="right">
    <div class="container">
        <h1>Login</h1>
        <p>Enter your credentials</p>

        <form method="POST">

            <div class="input-box">
                <i class="fa fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>

            <!-- ✅ Dynamic message from FastAPI -->
            {% if msg %}
                <div class="msg">{{ msg }}</div>
            {% endif %}

        </form>

        <div class="footer">
            New user? <a href="/register">Create Account</a>
        </div>
    </div>
</div>

</body>
</html>
