<!DOCTYPE html><html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot Pro</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
}

/* MAIN PANEL */
.chat-wrapper{
    width:100%;
    max-width:520px;
    height:92vh;
    display:flex;
    flex-direction:column;
    border-radius:25px;
    overflow:hidden;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(25px);
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
}

/* HEADER */
.header{
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    font-weight:600;
}

/* CHAT AREA */
.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

/* MESSAGE */
.message{
    max-width:75%;
    margin:8px 0;
    animation:fade 0.3s ease;
}

.user{align-self:flex-end;}
.bot{align-self:flex-start;}

.bubble{
    padding:12px 16px;
    border-radius:18px;
    font-size:14px;
}

.user .bubble{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

.bot .bubble{
    background:white;
    color:#333;
}

/* INPUT */
.input-area{
    display:flex;
    padding:12px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
}

input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:none;
    outline:none;
    font-size:14px;
}

button{
    margin-left:10px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* SCROLL */
.chat-box::-webkit-scrollbar{
    width:5px;
}
.chat-box::-webkit-scrollbar-thumb{
    background:#888;
    border-radius:10px;
}

/* ANIMATION */
@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}
</style></head><body><div class="chat-wrapper"><!-- HEADER --><div class="header">
    <div>🤖 AI Assistant</div>
    <a href="/logout" style="color:red;text-decoration:none;">Logout</a>
</div><!-- CHAT --><div class="chat-box" id="chatBox">
    {% for sender, message, time in chat_history %}
    <div class="message {{sender}}">
        <div class="bubble">{{message}}</div>
    </div>
    {% endfor %}
</div><!-- INPUT --><div class="input-area">
    <input id="msgInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">➤</button>
</div></div><script>
const box = document.getElementById("chatBox");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

// SCROLL
function scrollBottom(){
    box.scrollTop = box.scrollHeight;
}

// ADD MESSAGE
function addMessage(text, sender){
    let div = document.createElement("div");
    div.className = "message " + sender;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(div);
    scrollBottom();
}

// SEND
async function sendMessage(){
    let msg = input.value.trim();
    if(!msg) return;

    addMessage(msg,"user");
    input.value="";

    await fetch("/chat",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"message="+encodeURIComponent(msg)
    });

    location.reload();
}

// EVENTS
sendBtn.onclick = sendMessage;

input.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage();
    }
});

window.onload = scrollBottom;
</script></body>
</html>
