
<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #020617, #0f172a, #020617);
            overflow: hidden;
        }
        /* BACKGROUND GLOW */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
        }
        body::before {
            width: 400px;
            height: 400px;
            background: #00c6ff;
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: #ff00c8;
            bottom: -100px;
            right: -100px;
        }
        /* CONTAINER */
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            border-radius: 25px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(30px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
            position: relative;
            z-index: 1;
        }
        /* HEADER */
        .header {
            padding: 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }
        .status {
            font-size: 11px;
            color: #00ffae;
        }
        .header i {
            cursor: pointer;
            transition: 0.3s;
        }
        .header i:hover {
            color: #00c6ff;
            transform: scale(1.2);
        }
        /* CHAT AREA */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        /* MESSAGE */
        .message {
            max-width: 75%;
            margin: 10px 0;
            animation: fadeIn 0.4s ease;
        }
        .user { align-self: flex-end; }
        .bot { align-self: flex-start; }
        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 14px;
            position: relative;
        }
        .user .bubble {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot .bubble {
            background: rgba(255,255,255,0.9);
            color: black;
            border-bottom-left-radius: 5px;
        }
        .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
        }
        /* INPUT */
        .input-area {
            display: flex;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        input::placeholder {
            color: #ccc;
        }
        button {
            margin-left: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 15px #00c6ff;
        }
        /* SCROLL */
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #00c6ff;
            border-radius: 10px;
        }
        /* ANIMATION */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="avatar">🤖</div>
            <div>
                AI Impact Chatbot <br>
                <span class="status">● Online</span>
            </div>
        </div>
        <a href="/logout" style="color:red;">
            <i class="fa fa-sign-out-alt"></i>
        </a>
    </div>
    <!-- CHAT -->
    <div class="chat-box" id="chatBox">
        {% for sender, message, time in chat_history %}
            <div class="message {{ sender }}">
                <div class="bubble">{{ message }}</div>
                <div class="time">{{ time }}</div>
            </div>
        {% endfor %}
    </div>
    <!-- INPUT -->
    <form method="POST" class="input-area" onsubmit="return showTyping()">
        <input type="text" name="message" id="msgInput" placeholder="Ask something about AI..." required>
        <button type="submit"><i class="fa fa-paper-plane"></i></button>
    </form>
</div>
<script>
    const box = document.getElementById("chatBox");
    window.onload = () => {
        box.scrollTop = box.scrollHeight;
    };
    function showTyping() {
        let typing = document.createElement("div");
        typing.className = "message bot";
        typing.innerHTML = `<div class="bubble">Typing...</div>`;
        box.appendChild(typing);
        box.scrollTop = box.scrollHeight;
        return true;
    }
    document.getElementById("msgInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            this.form.submit();
        }
    });
</script>
</body>
</html>
