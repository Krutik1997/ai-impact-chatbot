<!DOCTYPE html><html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot Ultra</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

/* ANIMATED BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* CHAT PANEL */
.chat-wrapper{
    width:100%;
    max-width:550px;
    height:92vh;
    display:flex;
    flex-direction:column;
    border-radius:25px;
    overflow:hidden;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(30px);
    box-shadow:0 25px 80px rgba(0,0,0,0.3);
}

/* HEADER */
.header{
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(20px);
    font-weight:600;
}

/* CHAT */
.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

/* MESSAGE */
.message{
    max-width:75%;
    margin:10px 0;
    animation:fade 0.3s ease;
}

.user{align-self:flex-end;}
.bot{align-self:flex-start;}

.bubble{
    padding:12px 16px;
    border-radius:18px;
    font-size:14px;
}

.user .bubble{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
}

.bot .bubble{
    background:white;
    color:#333;
}

/* TIME */
.time{
    font-size:10px;
    opacity:0.6;
    margin-top:3px;
}

/* INPUT */
.input-area{
    display:flex;
    padding:12px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(20px);
}

input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:none;
    outline:none;
}

button{
    margin-left:10px;
    width:50px;
    height:50px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1) rotate(10deg);
}

/* TYPING */
.typing span{
    display:inline-block;
    width:6px;
    height:6px;
    margin:2px;
    background:#999;
    border-radius:50%;
    animation:blink 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}

@keyframes blink{
    0%,80%,100%{opacity:0;}
    40%{opacity:1;}
}

/* FADE */
@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}
</style></head><body><div class="chat-wrapper"><div class="header">
    <div>🤖 AI Impact Chatbot</div>
    <a href="/logout" style="color:red;text-decoration:none;">Logout</a>
</div><div class="chat-box" id="chatBox">
    {% for sender, message, time in chat_history %}
    <div class="message {{sender}}">
        <div class="bubble">{{message}}</div>
        <div class="time">{{time}}</div>
    </div>
    {% endfor %}
</div><div class="input-area">
    <input id="msgInput" placeholder="Ask anything..." autocomplete="off">
    <button id="sendBtn">➤</button>
</div></div><script>
const box = document.getElementById("chatBox");
const input = document.getElementById("msgInput");
const btn = document.getElementById("sendBtn");

// TIME
function getTime(){
    let d=new Date();
    return d.getHours()+":"+d.getMinutes().toString().padStart(2,'0');
}

// ADD MESSAGE
function addMessage(text,sender){
    let div=document.createElement("div");
    div.className="message "+sender;
    div.innerHTML=`<div class="bubble">${text}</div>
                   <div class="time">${getTime()}</div>`;
    box.appendChild(div);
    box.scrollTop=box.scrollHeight;
}

// TYPE EFFECT
function typeEffect(text){
    let i=0;
    let div=document.createElement("div");
    div.className="message bot";
    div.innerHTML=`<div class="bubble"></div><div class="time">${getTime()}</div>`;
    box.appendChild(div);

    let bubble=div.querySelector(".bubble");

    let interval=setInterval(()=>{
        bubble.innerHTML+=text.charAt(i);
        i++;
        box.scrollTop=box.scrollHeight;
        if(i>=text.length) clearInterval(interval);
    },15);
}

// SEND
async function sendMessage(){
    let msg=input.value.trim();
    if(!msg) return;

    addMessage(msg,"user");
    input.value="";

    // typing
    let typing=document.createElement("div");
    typing.className="message bot";
    typing.innerHTML=`<div class="bubble typing">
    <span></span><span></span><span></span></div>`;
    box.appendChild(typing);

    try{
        let res=await fetch("/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:msg})
        });

        let data=await res.json();
        typing.remove();

        typeEffect(data.reply);

    }catch{
        typing.remove();
        addMessage("Server error","bot");
    }
}

// EVENTS
btn.onclick=sendMessage;

input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage();
    }
});

window.onload=()=>box.scrollTop=box.scrollHeight;
</script></body>
</html>
