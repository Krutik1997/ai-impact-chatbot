<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at top, #020617, #0f172a, #020617);
    }

    /* BACKGROUND GLOW */
    body::before, body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        z-index: 0;
    }

    body::before {
        width: 300px;
        height: 300px;
        background: #00c6ff;
        top: -80px;
        left: -80px;
    }

    body::after {
        width: 300px;
        height: 300px;
        background: #ff00c8;
        bottom: -80px;
        right: -80px;
    }

    /* CONTAINER */
    .chat-container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(20px);
        position: relative;
        z-index: 1;
    }

    /* HEADER */
    .header {
        padding: 15px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.05);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
    }

    .status {
        font-size: 11px;
        color: #00ffae;
    }

    .header i {
        cursor: pointer;
        transition: 0.3s;
    }

    .header i:hover {
        color: #00c6ff;
        transform: scale(1.2);
    }

    /* CHAT AREA */
    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
    }

    /* MESSAGE */
    .message {
        max-width: 75%;
        margin: 8px 0;
        animation: fadeIn 0.3s ease;
    }

    .user { align-self: flex-end; }
    .bot { align-self: flex-start; }

    .bubble {
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        word-wrap: break-word;
    }

    .user .bubble {
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: white;
        border-bottom-right-radius: 5px;
    }

    .bot .bubble {
        background: rgba(255,255,255,0.9);
        color: black;
        border-bottom-left-radius: 5px;
    }

    .time {
        font-size: 10px;
        opacity: 0.6;
        margin-top: 3px;
    }

    /* INPUT */
    .input-area {
        display: flex;
        padding: 10px;
        background: rgba(255,255,255,0.05);
        border-top: 1px solid rgba(255,255,255,0.1);
        position: sticky;
        bottom: 0;
        z-index: 10;
    }

    input {
        flex: 1;
        padding: 12px;
        border-radius: 25px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.1);
        color: white;
        font-size: 16px;
    }

    input::placeholder {
        color: #ccc;
    }

    button {
        margin-left: 10px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: white;
        cursor: pointer;
    }

    /* SCROLL */
    .chat-box::-webkit-scrollbar {
        width: 4px;
    }

    .chat-box::-webkit-scrollbar-thumb {
        background: #00c6ff;
        border-radius: 10px;
    }

    /* ANIMATION */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

</style>

</head><body><div class="chat-container"><!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="avatar">🤖</div>
        <div>
            AI Impact Chatbot <br>
            <span class="status">● Online</span>
        </div>
    </div>

    <a href="/logout" style="color:red;">
        <i class="fa fa-sign-out-alt"></i>
    </a>
</div>

<!-- CHAT -->
<div class="chat-box" id="chatBox">
    {% for sender, message, time in chat_history %}
        <div class="message {{ sender }}">
            <div class="bubble">{{ message }}</div>
            <div class="time">{{ time }}</div>
        </div>
    {% endfor %}
</div>

<!-- INPUT -->
<form method="POST" class="input-area" onsubmit="return showTyping()">
    <input type="text" name="message" id="msgInput" placeholder="Ask something about AI..." required>
    <button type="submit"><i class="fa fa-paper-plane"></i></button>
</form>

</div><script>
    const box = document.getElementById("chatBox");

    window.onload = () => {
        box.scrollTop = box.scrollHeight;
    };

    function showTyping() {
        let typing = document.createElement("div");
        typing.className = "message bot";
        typing.innerHTML = `<div class="bubble">Typing...</div>`;
        box.appendChild(typing);
        box.scrollTop = box.scrollHeight;
        return true;
    }

    document.getElementById("msgInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            this.form.submit();
        }
    });
</script></body>
</html>
