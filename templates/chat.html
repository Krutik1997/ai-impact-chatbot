<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Impact Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,#dfe9f3,#ffffff);
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 16px;
            backdrop-filter: blur(15px);
            background: rgba(255,255,255,0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* CHAT */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            padding-bottom: 90px;
        }

        .message {
            max-width: 75%;
            margin: 6px 0;
        }

        .user {
            align-self: flex-end;
        }

        .bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user .bubble {
            background: linear-gradient(135deg,#6a11cb,#2575fc);
            color: white;
        }

        .bot .bubble {
            background: #ffffff;
            color: #333;
        }

        .time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* INPUT */
        .input-area {
            position: sticky;
            bottom: 0;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #f1f5f9;
        }

        button {
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg,#6a11cb,#2575fc);
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div>🤖 AI Impact Chatbot</div>
        <a href="/logout" style="color:#ff4d4d;">Logout</a>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">

        {% for sender, message, time in chat_history %}
            <div class="message {{ sender }}">
                <div class="bubble">{{ message }}</div>
                <div class="time">{{ time }}</div>
            </div>
        {% endfor %}

    </div>

    <!-- INPUT -->
    <form class="input-area" method="POST" action="/chat">
        <input id="msgInput" name="message" placeholder="Type a message..." required>
        <button type="submit">➤</button>
    </form>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("msgInput");

/* AUTO SCROLL */
window.onload = () => {
    chatBox.scrollTop = chatBox.scrollHeight;
};

/* FIX MOBILE KEYBOARD */
input.addEventListener("focus", () => {
    setTimeout(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 300);
});

/* ENTER KEY FIX */
input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        this.form.submit();
    }
});
</script>

</body>
</html>
