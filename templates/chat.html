<!DOCTYPE html><html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot Pro</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background:#020617;
    color:white;
}

.app{
    display:flex;
    height:100dvh;
}

.sidebar{
    width:260px;
    background:#020617;
    padding:15px;
    display:none;
}

@media(min-width:900px){
    .sidebar{display:block;}
}

.chat-container{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    padding:12px;
    background:rgba(255,255,255,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* CHAT */
.chat-box{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

/* MESSAGE */
.message{
    max-width:75%;
    margin:6px 0;
}

.user{align-self:flex-end;}
.bot{align-self:flex-start;}

.bubble{
    padding:12px 14px;
    border-radius:15px;
    font-size:14px;
}

.user .bubble{
    background:linear-gradient(135deg,#00c6ff,#0072ff);
}

.bot .bubble{
    background:#e5e7eb;
    color:black;
}

/* INPUT */
.input-area{
    display:flex;
    padding:10px;
    background:#020617;
}

input{
    flex:1;
    padding:12px;
    border-radius:20px;
    border:none;
    outline:none;
    font-size:15px;
}

button{
    margin-left:5px;
    border:none;
    border-radius:50%;
    width:45px;
    height:45px;
    background:#0072ff;
    color:white;
    cursor:pointer;
}

/* TYPING DOTS */
.typing span{
    display:inline-block;
    width:6px;
    height:6px;
    margin:2px;
    background:#999;
    border-radius:50%;
    animation:blink 1.4s infinite;
}

.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}

@keyframes blink{
    0%,80%,100%{opacity:0;}
    40%{opacity:1;}
}
</style></head><body><div class="app"><div class="sidebar">
    <div>+ New Chat</div>
</div><div class="chat-container"><div class="header">
    <div>🤖 AI Chatbot</div>
    <a href="/logout" style="color:red;"><i class="fa fa-sign-out-alt"></i></a>
</div><div class="chat-box" id="chatBox"></div><div class="input-area">
    <input id="msgInput" placeholder="Type message..." autocomplete="off">
    <button id="sendBtn"><i class="fa fa-paper-plane"></i></button>
</div></div>
</div><script>
const box = document.getElementById("chatBox");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

// ADD MESSAGE
function addMessage(text, sender){
    let div = document.createElement("div");
    div.className = "message " + sender;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// TYPE EFFECT
function typeEffect(text){
    let i = 0;
    let div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = `<div class="bubble"></div>`;
    box.appendChild(div);

    let bubble = div.querySelector(".bubble");

    let interval = setInterval(()=>{
        bubble.innerHTML += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        if(i >= text.length) clearInterval(interval);
    },15);
}

// SEND MESSAGE
async function sendMessage(){
    let msg = input.value.trim();
    if(!msg) return;

    addMessage(msg, "user");
    input.value = "";

    // typing indicator
    let typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerHTML = `<div class="bubble typing">
        <span></span><span></span><span></span>
    </div>`;
    box.appendChild(typing);
    box.scrollTop = box.scrollHeight;

    try{
        let res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({message: msg})
        });

        let data = await res.json();
        typing.remove();

        if(data.reply){
            typeEffect(data.reply);
        } else {
            addMessage("⚠️ No reply from server", "bot");
        }

    }catch(err){
        typing.remove();
        addMessage("⚠️ Server error", "bot");
        console.error(err);
    }
}

// BUTTON CLICK
sendBtn.addEventListener("click", sendMessage);

// ENTER KEY (FIXED)
input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }
});

// AUTO FOCUS
window.onload = () => input.focus();

</script></body>
</html>
