<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Impact Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f7f9fc;
        }

        /* APP LAYOUT */
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* FIX for mobile keyboard */
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #ffffffcc;
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .title {
            font-weight: 600;
            font-size: 16px;
        }

        .logout {
            color: #ef4444;
            text-decoration: none;
            font-weight: 500;
        }

        /* CHAT AREA */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        /* MESSAGE */
        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
        }

        .user {
            align-self: flex-end;
            text-align: right;
        }

        .bot {
            align-self: flex-start;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot .bubble {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: #111827;
            border-bottom-left-radius: 6px;
        }

        .time {
            font-size: 11px;
            color: #6b7280;
            margin-top: 3px;
        }

        /* INPUT */
        .input-area {
            position: sticky;
            bottom: 0;
            background: #ffffffcc;
            backdrop-filter: blur(12px);
            padding: 10px;
            border-top: 1px solid #e5e7eb;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 25px;
            padding: 6px 10px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px;
            background: transparent;
            font-size: 14px;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        /* SCROLLBAR CLEAN */
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        /* MOBILE FIX */
        @media (max-width: 600px) {
            .bubble {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div class="title">🤖 AI Impact Chatbot</div>
        <a href="/logout" class="logout">Logout</a>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">

        {% for sender, message, time in chat_history %}
        <div class="message {{ sender }}">
            <div class="bubble">{{ message }}</div>
            <div class="time">{{ time }}</div>
        </div>
        {% endfor %}

    </div>

    <!-- INPUT -->
    <form method="POST" action="/chat" class="input-area">
        <div class="input-box">
            <input id="msgInput" name="message" placeholder="Type your message..." autocomplete="off" required>
            <button type="submit">➤</button>
        </div>
    </form>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("msgInput");

/* AUTO SCROLL */
function scrollBottom(){
    chatBox.scrollTop = chatBox.scrollHeight;
}

window.onload = scrollBottom;

/* MOBILE KEYBOARD FIX */
input.addEventListener("focus", () => {
    setTimeout(scrollBottom, 300);
});

/* ENTER FIX */
input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        this.form.submit();
    }
});
</script>

</body>
</html>
