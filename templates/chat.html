<!DOCTYPE html>

<html lang="en">
<head>
    <title>AI Chatbot Pro</title>

<!-- Fonts + Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #0f172a;
        color: white;
    }

    .app {
        display: flex;
        height: 100dvh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: #020617;
        padding: 15px;
        display: none;
        flex-direction: column;
    }

    @media(min-width: 900px){
        .sidebar { display: flex; }
    }

    .new-chat {
        background: linear-gradient(135deg,#00c6ff,#0072ff);
        padding: 10px;
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
        margin-bottom: 10px;
    }

    /* CHAT */
    .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* HEADER */
    .header {
        padding: 12px;
        background: rgba(15,23,42,0.9);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(10px);
    }

    /* CHAT BOX */
    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
    }

    .message {
        max-width: 75%;
        margin: 5px 0;
    }

    .user { align-self: flex-end; }
    .bot { align-self: flex-start; }

    .bubble {
        padding: 12px;
        border-radius: 15px;
    }

    .user .bubble {
        background: linear-gradient(135deg,#00c6ff,#0072ff);
    }

    .bot .bubble {
        background: #e5e7eb;
        color: black;
    }

    /* INPUT */
    .input-area {
        display: flex;
        padding: 10px;
        background: #020617;
    }

    input {
        flex: 1;
        padding: 12px;
        border-radius: 20px;
        border: none;
    }

    button {
        margin-left: 5px;
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        background: #0072ff;
        color: white;
    }

    /* TYPING DOTS */
    .typing {
        display: flex;
        gap: 4px;
    }

    .typing span {
        width: 6px;
        height: 6px;
        background: gray;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }

    .typing span:nth-child(2){ animation-delay: .2s;}
    .typing span:nth-child(3){ animation-delay: .4s;}

    @keyframes blink {
        0%,80%,100%{ opacity: 0;}
        40%{ opacity: 1;}
    }

</style>
```

</head>

<body>

<div class="app">

```
<!-- SIDEBAR -->
<div class="sidebar">
    <div class="new-chat">+ New Chat</div>
    <div>History coming...</div>
</div>

<!-- CHAT -->
<div class="chat-container">

    <div class="header">
        <div>🤖 AI Chatbot</div>
        <div>
            <button onclick="toggleTheme()">🌙</button>
            <a href="/logout" style="color:red;"><i class="fa fa-sign-out-alt"></i></a>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input id="msgInput" placeholder="Type message...">
        <button onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
        <button onclick="startVoice()">🎤</button>
    </div>

</div>
```

</div>

<script>
const box = document.getElementById("chatBox");

function addMessage(text, sender){
    let div = document.createElement("div");
    div.className = "message " + sender;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
    let input = document.getElementById("msgInput");
    let msg = input.value;
    if(!msg) return;

    addMessage(msg, "user");
    input.value = "";

    let typing = document.createElement("div");
    typing.className = "message bot";
    typing.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    box.appendChild(typing);

    let res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    typing.remove();

    typeEffect(data.reply);
}

function typeEffect(text){
    let i = 0;
    let div = document.createElement("div");
    div.className = "message bot";
    div.innerHTML = `<div class="bubble"></div>`;
    box.appendChild(div);

    let bubble = div.querySelector(".bubble");

    let interval = setInterval(()=>{
        bubble.innerHTML += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        if(i >= text.length) clearInterval(interval);
    },20);
}

/* DARK MODE */
function toggleTheme(){
    document.body.classList.toggle("light");
}

/* VOICE INPUT */
function startVoice(){
    let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.start();
    rec.onresult = e => {
        document.getElementById("msgInput").value = e.results[0][0].transcript;
    }
}
</script>

</body>
</html>
